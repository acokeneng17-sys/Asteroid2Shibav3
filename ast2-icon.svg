<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shibaFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#cyanBorder)" stroke-width="16"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Shiba Astronaut Ears -->
  <polygon points="170,140 130,220 210,200" fill="url(#shibaFur)"/>
  <polygon points="165,155 142,210 195,198" fill="#fda4af"/>
  <polygon points="342,140 382,220 302,200" fill="url(#shibaFur)"/>
  <polygon points="347,155 370,210 317,198" fill="#fda4af"/>

  <!-- Space Helmet -->
  <circle cx="256" cy="250" r="135" fill="#e0f2fe" fill-opacity="0.25" stroke="#38bdf8" stroke-width="10"/>

  <!-- Shiba Head -->
  <ellipse cx="256" cy="250" rx="90" ry="80" fill="url(#shibaFur)"/>
  <ellipse cx="256" cy="280" rx="60" ry="46" fill="#ffffff"/>

  <!-- Eyes -->
  <ellipse cx="220" cy="235" rx="12" ry="16" fill="#1e293b"/>
  <circle cx="216" cy="230" r="4" fill="#ffffff"/>
  <ellipse cx="292" cy="235" rx="12" ry="16" fill="#1e293b"/>
  <circle cx="288" cy="230" r="4" fill="#ffffff"/>

  <!-- Eyebrows -->
  <circle cx="214" cy="208" r="9" fill="#ffffff"/>
  <circle cx="298" cy="208" r="9" fill="#ffffff"/>

  <!-- Nose & Smile -->
  <polygon points="256,264 246,252 266,252" fill="#0f172a"/>
  <path d="M 246 270 Q 256 278 266 270" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="195" cy="265" r="14" fill="#fda4af" opacity="0.6"/>
  <circle cx="317" cy="265" r="14" fill="#fda4af" opacity="0.6"/>

  <!-- Spacesuit Collar -->
  <path d="M 180 370 Q 256 420 332 370 L 340 430 Q 256 470 172 430 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="6"/>

  <!-- $AST2 Banner -->
  <rect x="146" y="410" width="220" height="52" rx="26" fill="#0f172a" stroke="url(#gold)" stroke-width="4"/>
  <text x="256" y="446" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="url(#gold)" text-anchor="middle" letter-spacing="2">$AST2</text>
</svg>
